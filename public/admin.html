<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METAR Board - Admin</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.png"/>
  <style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 20px;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="time"],
    input[type="number"] {
      font-size: 18px;
      padding: 6px;
      width: 100px;
      margin-top: 6px;
    }
    select {
      font-size: 18px;
      padding: 6px;
      margin-top: 6px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
    }
    .checkbox-row input {
      width: 24px;
      height: 24px;
    }
    .checkbox-row label {
      margin: 0;
      font-weight: normal;
    }
    button {
      margin-top: 28px;
      font-size: 18px;
      padding: 10px 24px;
    }
    #status {
      margin-top: 16px;
      font-weight: bold;
    }
    #status.error {
      color: #b00020;
    }
    #status.success {
      color: #1a7f37;
    }
    #deviceStatus {
      font-size: 13px;
      color: #666;
      background: #f2f2f2;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }
    #bootstrapPasswordSection {
      background: #fff8e6;
      border: 1px solid #e8c766;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    #bootstrapPasswordSection p {
      margin: 0 0 4px;
      font-size: 14px;
    }
    #changePasswordSection {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>METAR Board Admin</h1>

  <div id="loginForm" style="display: none;">
    <p>Enter the admin password to continue.</p>
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword">
    <button id="loginBtn">Log In</button>
    <div id="loginStatus" class="error"></div>
  </div>

  <div id="settingsForm" style="display: none;">
  <p>Changes here are pushed to the display immediately - it will refresh on its own.</p>

  <div id="deviceStatus">Loading device status...</div>

  <div id="bootstrapPasswordSection" style="display: none;">
    <p><strong>No admin password is set yet</strong> - anyone on this network can currently change these settings.</p>
    <label for="bootstrapPassword">Set an Admin Password</label>
    <input type="password" id="bootstrapPassword" placeholder="At least 4 characters">
    <button id="bootstrapPasswordBtn" type="button">Set Password</button>
    <div id="bootstrapPasswordStatus"></div>
  </div>

  <label for="homeAirport">Home Airport</label>
  <input type="text" id="homeAirport" placeholder="e.g. KFDK">

  <label for="favoriteAirports">Favorite Airports (comma-separated, up to 6)</label>
  <input type="text" id="favoriteAirports" placeholder="e.g. KMRB, KEEN" style="width: 280px;">

  <label for="startupzoom">Default Zoom Level (1-20)</label>
  <input type="number" id="startupzoom" min="1" max="20" step="1">

  <label for="timezone">Timezone</label>
  <select id="timezone">
    <option value="America/New_York">Eastern</option>
    <option value="America/Chicago">Central</option>
    <option value="America/Denver">Mountain</option>
    <option value="America/Phoenix">Mountain (Arizona, no DST)</option>
    <option value="America/Los_Angeles">Pacific</option>
    <option value="America/Anchorage">Alaska</option>
    <option value="Pacific/Honolulu">Hawaii</option>
    <option value="UTC">UTC</option>
  </select>

  <div class="checkbox-row">
    <input type="checkbox" id="showRadarByDefault">
    <label for="showRadarByDefault">Show live radar by default</label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="useOSMonlinemap">
    <label for="useOSMonlinemap">Show OpenStreetMap street map background (requires internet)</label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="nightDimEnabled">
    <label for="nightDimEnabled">Dim the display at night</label>
  </div>

  <div id="nightDimFields">
    <label for="nightDimStart">Dim from</label>
    <input type="time" id="nightDimStart">

    <label for="nightDimEnd">Until</label>
    <input type="time" id="nightDimEnd">

    <label for="nightDimOpacity">Dim strength (0-90%)</label>
    <input type="number" id="nightDimOpacity" min="0" max="90" step="5">
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="showTfrOverlay">
    <label for="showTfrOverlay">Show active TFRs (Temporary Flight Restrictions)</label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="showHomeAirspace">
    <label for="showHomeAirspace">Show home airport's airspace boundary</label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="showTraffic">
    <label for="showTraffic">Show live ADS-B traffic</label>
  </div>

  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <div id="changePasswordSection" style="display: none;">
    <label for="changePassword">Change Admin Password</label>
    <input type="password" id="changePassword" placeholder="At least 4 characters">
    <button id="changePasswordBtn" type="button">Update Password</button>
    <div id="changePasswordStatus"></div>
  </div>
  </div>

  <script>
    const homeAirportInput = document.getElementById("homeAirport");
    const favoriteAirportsInput = document.getElementById("favoriteAirports");
    const startupzoomInput = document.getElementById("startupzoom");
    const timezoneSelect = document.getElementById("timezone");
    const showRadarCheckbox = document.getElementById("showRadarByDefault");
    const useOSMCheckbox = document.getElementById("useOSMonlinemap");
    const nightDimEnabledCheckbox = document.getElementById("nightDimEnabled");
    const nightDimStartInput = document.getElementById("nightDimStart");
    const nightDimEndInput = document.getElementById("nightDimEnd");
    const nightDimOpacityInput = document.getElementById("nightDimOpacity");
    const showTfrOverlayCheckbox = document.getElementById("showTfrOverlay");
    const showHomeAirspaceCheckbox = document.getElementById("showHomeAirspace");
    const showTrafficCheckbox = document.getElementById("showTraffic");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");
    const loginFormEl = document.getElementById("loginForm");
    const settingsFormEl = document.getElementById("settingsForm");
    const loginPasswordInput = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginStatusEl = document.getElementById("loginStatus");
    const bootstrapSectionEl = document.getElementById("bootstrapPasswordSection");
    const bootstrapPasswordInput = document.getElementById("bootstrapPassword");
    const bootstrapPasswordBtn = document.getElementById("bootstrapPasswordBtn");
    const bootstrapPasswordStatusEl = document.getElementById("bootstrapPasswordStatus");
    const changeSectionEl = document.getElementById("changePasswordSection");
    const changePasswordInput = document.getElementById("changePassword");
    const changePasswordBtn = document.getElementById("changePasswordBtn");
    const changePasswordStatusEl = document.getElementById("changePasswordStatus");

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "success";
    }

    function loadSettingsForm() {
      loginFormEl.style.display = "none";
      settingsFormEl.style.display = "block";
      loadDeviceStatusAndSettings();
    }

    function checkAdminSession() {
      fetch("/admin/session")
        .then((res) => res.json())
        .then(({ passwordSet, authed }) => {
          if (!passwordSet) {
            bootstrapSectionEl.style.display = "block";
            changeSectionEl.style.display = "none";
            loadSettingsForm();
          }
          else if (!authed) {
            loginFormEl.style.display = "block";
            settingsFormEl.style.display = "none";
          }
          else {
            bootstrapSectionEl.style.display = "none";
            changeSectionEl.style.display = "block";
            loadSettingsForm();
          }
        })
        .catch(() => loadSettingsForm());
    }

    loginBtn.addEventListener("click", () => {
      fetch("/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: loginPasswordInput.value })
      })
        .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
        .then(({ ok, body }) => {
          if (!ok) throw new Error(body.error || "Login failed");
          loginStatusEl.textContent = "";
          checkAdminSession();
        })
        .catch((err) => { loginStatusEl.textContent = err.message; });
    });

    bootstrapPasswordBtn.addEventListener("click", () => {
      if (bootstrapPasswordInput.value.length < 4) {
        bootstrapPasswordStatusEl.textContent = "Password must be at least 4 characters.";
        bootstrapPasswordStatusEl.className = "error";
        return;
      }
      fetch("/admin/set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: bootstrapPasswordInput.value })
      })
        .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
        .then(({ ok, body }) => {
          if (!ok) throw new Error(body.error || "Failed to set password");
          bootstrapSectionEl.style.display = "none";
          changeSectionEl.style.display = "block";
        })
        .catch((err) => {
          bootstrapPasswordStatusEl.textContent = err.message;
          bootstrapPasswordStatusEl.className = "error";
        });
    });

    changePasswordBtn.addEventListener("click", () => {
      if (changePasswordInput.value.length < 4) {
        changePasswordStatusEl.textContent = "Password must be at least 4 characters.";
        changePasswordStatusEl.className = "error";
        return;
      }
      fetch("/admin/set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: changePasswordInput.value })
      })
        .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
        .then(({ ok, body }) => {
          if (!ok) throw new Error(body.error || "Failed to update password");
          changePasswordInput.value = "";
          changePasswordStatusEl.textContent = "Password updated.";
          changePasswordStatusEl.className = "success";
        })
        .catch((err) => {
          changePasswordStatusEl.textContent = err.message;
          changePasswordStatusEl.className = "error";
        });
    });

    checkAdminSession();

    function loadDeviceStatusAndSettings() {
    fetch("/updatestatus")
      .then(res => res.json())
      .then(update => {
        const deviceStatusEl = document.getElementById("deviceStatus");
        const version = update.version || "unknown";
        const when = update.checkedAt ? new Date(update.checkedAt).toLocaleString() : "never";
        deviceStatusEl.textContent = `Version ${version} - last update check: ${update.status} (${when})`;
      })
      .catch(() => {});

    fetch("/getsettings")
      .then(res => res.json())
      .then(settings => {
        homeAirportInput.value = settings.homeAirport || "";
        favoriteAirportsInput.value = (settings.favoriteAirports || []).join(", ");
        startupzoomInput.value = settings.startupzoom || "";
        if (settings.timezone) {
          timezoneSelect.value = settings.timezone;
        }
        showRadarCheckbox.checked = !!settings.showRadarByDefault;
        useOSMCheckbox.checked = !!settings.useOSMonlinemap;
        nightDimEnabledCheckbox.checked = !!settings.nightDimEnabled;
        nightDimStartInput.value = settings.nightDimStart || "22:00";
        nightDimEndInput.value = settings.nightDimEnd || "06:00";
        nightDimOpacityInput.value = settings.nightDimOpacity ?? 70;
        showTfrOverlayCheckbox.checked = settings.showTfrOverlay !== false;
        showHomeAirspaceCheckbox.checked = settings.showHomeAirspace !== false;
        showTrafficCheckbox.checked = settings.showTraffic !== false;
      })
      .catch(err => setStatus("Failed to load current settings: " + err.message, true));

    saveBtn.addEventListener("click", () => {
      const icao = homeAirportInput.value.trim().toUpperCase();
      if (!/^[A-Z0-9]{3,4}$/.test(icao)) {
        setStatus("Home airport must be a 3-4 character ICAO/FAA code.", true);
        return;
      }

      const favoriteAirports = favoriteAirportsInput.value
        .split(",")
        .map((v) => v.trim().toUpperCase())
        .filter((v) => v.length > 0);
      if (favoriteAirports.some((v) => !/^[A-Z0-9]{3,4}$/.test(v))) {
        setStatus("Favorite airports must each be a 3-4 character ICAO/FAA code.", true);
        return;
      }
      if (favoriteAirports.length > 6) {
        setStatus("Favorite airports: 6 maximum.", true);
        return;
      }

      const startupzoom = Number(startupzoomInput.value);
      if (!Number.isInteger(startupzoom) || startupzoom < 1 || startupzoom > 20) {
        setStatus("Default zoom level must be a whole number from 1 to 20.", true);
        return;
      }

      const nightDimOpacity = Number(nightDimOpacityInput.value);
      if (!Number.isInteger(nightDimOpacity) || nightDimOpacity < 0 || nightDimOpacity > 90) {
        setStatus("Dim strength must be a whole number from 0 to 90.", true);
        return;
      }

      fetch("/savesettings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          homeAirport: icao,
          favoriteAirports: favoriteAirports,
          startupzoom: startupzoom,
          timezone: timezoneSelect.value,
          showRadarByDefault: showRadarCheckbox.checked,
          useOSMonlinemap: useOSMCheckbox.checked,
          nightDimEnabled: nightDimEnabledCheckbox.checked,
          nightDimStart: nightDimStartInput.value,
          nightDimEnd: nightDimEndInput.value,
          nightDimOpacity: nightDimOpacity,
          showTfrOverlay: showTfrOverlayCheckbox.checked,
          showHomeAirspace: showHomeAirspaceCheckbox.checked,
          showTraffic: showTrafficCheckbox.checked
        })
      })
        .then(res => {
          if (!res.ok) return res.json().then(body => { throw new Error(body.error || "Save failed"); });
          return res.json();
        })
        .then(() => setStatus("Saved - the display will refresh shortly.", false))
        .catch(err => setStatus("Failed to save: " + err.message, true));
    });
    }
  </script>
</body>
</html>
